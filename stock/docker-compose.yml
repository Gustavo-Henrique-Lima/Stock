services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: estoque
      APP_USER_PASSWORD: Estoque@123
      APP_DB: XEPDB1
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle:/container-entrypoint-initdb.d
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo \"SELECT 1 FROM dual;\" | sqlplus -s estoque/Estoque@123@//localhost:1521/XEPDB1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: homolog
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: estoque
      SPRING_DATASOURCE_PASSWORD: Estoque@123
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
